<!doctype html>
<html class="dark" lang="tr" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title data-i18n="dashboard.pageTitle">Volta — Yerel Yük Testi</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="/js/tailwind-config.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <style>
      [hidden] {
        display: none !important;
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      body {
        background-color: #0b0e14;
        color: #e1e2eb;
      }
      .tech-grid {
        background-image: radial-gradient(#30363d 1px, transparent 1px);
        background-size: 20px 20px;
      }
      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }
    </style>
  </head>
  <body class="min-h-screen font-body-md text-body-md overflow-x-hidden">
    <!-- Üst menü: core/header.js doldurur -->
    <div id="app-header" data-active="dashboard"></div>

    <main
      class="pt-20 pb-10 px-margin-page max-w-[1920px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-gutter"
    >
      <!-- Sol sütun: form -->
      <section class="lg:col-span-3 flex flex-col gap-4">
        <form
          id="test-form"
          novalidate
          class="border border-border-subtle bg-surface-container-lowest p-5 flex flex-col gap-4 relative"
        >
          <div class="absolute top-0 left-0 w-full h-1 bg-border-subtle"></div>
          <h2
            class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-1"
            data-i18n="form.title"
          >
            Test Kur
          </h2>

          <!-- Hedef URL (sağında kayıtlı hedefler butonu) -->
          <div class="flex flex-col gap-2 group">
            <label
              for="url"
              class="font-data-md text-data-md text-on-surface-variant group-focus-within:text-primary-container transition-colors"
              data-i18n="form.url"
              >Hedef URL</label
            >
            <div class="relative">
              <span
                class="material-symbols-outlined absolute left-3 top-2.5 text-border-subtle group-focus-within:text-primary-container text-[20px]"
                >link</span
              >
              <!-- autocomplete="off": tarayıcının kendi "önceden yazdıkların" listesi çıkmasın -->
              <input
                id="url"
                required
                type="text"
                autocomplete="off"
                spellcheck="false"
                placeholder="http://localhost:3000/api/users"
                class="w-full bg-surface-container-lowest border border-border-subtle py-2 pl-10 pr-11 font-data-md text-data-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all"
              />
              <button
                type="button"
                id="target-book-btn"
                data-i18n-title="book.open"
                class="absolute right-1.5 top-1/2 -translate-y-1/2 p-1.5 rounded text-on-surface-variant hover:text-primary-container hover:bg-surface-variant transition-colors disabled:opacity-40 disabled:hover:bg-transparent disabled:hover:text-on-surface-variant"
              >
                <span class="material-symbols-outlined text-[20px] block"
                  >contacts</span
                >
              </button>
            </div>
          </div>

          <!-- Yöntem -->
          <div class="flex flex-col gap-2 group">
            <label
              for="method"
              class="font-data-md text-data-md text-on-surface-variant group-focus-within:text-primary-container transition-colors"
              data-i18n="form.method"
              >Yöntem</label
            >
            <select
              id="method"
              class="w-full bg-surface-container-lowest border border-border-subtle py-2 px-3 font-data-md text-data-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all appearance-none cursor-pointer"
            >
              <option value="GET">GET</option>
              <option value="POST">POST</option>
            </select>
          </div>

          <!-- Test türü -->
          <div class="flex flex-col gap-2">
            <span
              class="font-data-md text-data-md text-on-surface-variant"
              data-i18n="form.profile"
              >Test Türü</span
            >
            <div class="grid grid-cols-2 border border-border-subtle p-1 gap-1">
              <button
                type="button"
                data-profile="CONSTANT"
                class="py-2 font-data-md text-[13px] transition-colors"
                data-i18n="form.profile.constant"
              >
                Sabit Yük
              </button>
              <button
                type="button"
                data-profile="STEPPED"
                class="py-2 font-data-md text-[13px] transition-colors"
                data-i18n="form.profile.stepped"
              >
                Kademeli Artış
              </button>
            </div>
          </div>

          <!-- RPS ve süre -->
          <div class="grid grid-cols-2 gap-4">
            <div class="flex flex-col gap-2 group">
              <label
                id="rps-label"
                for="targetRps"
                class="font-data-md text-data-md text-on-surface-variant group-focus-within:text-primary-container transition-colors"
                data-i18n="form.rps"
                >Saniyede İstek</label
              >
              <input
                id="targetRps"
                required
                type="number"
                class="w-full bg-surface-container-lowest border border-border-subtle py-2 px-3 font-data-md text-data-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all"
              />
            </div>
            <div class="flex flex-col gap-2 group">
              <label
                for="duration"
                class="font-data-md text-data-md text-on-surface-variant group-focus-within:text-primary-container transition-colors"
                data-i18n="form.duration"
                >Süre (s)</label
              >
              <input
                id="duration"
                required
                type="number"
                class="w-full bg-surface-container-lowest border border-border-subtle py-2 px-3 font-data-md text-data-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all"
              />
            </div>
          </div>

          <!-- Kademe sayısı (sadece kademeli testte) -->
          <div id="steps-block" hidden class="flex flex-col gap-2 group">
            <label
              for="stepCount"
              class="font-data-md text-data-md text-on-surface-variant group-focus-within:text-primary-container transition-colors"
              data-i18n="form.steps"
              >Kademe Sayısı</label
            >
            <input
              id="stepCount"
              type="number"
              value="4"
              class="w-full bg-surface-container-lowest border border-border-subtle py-2 px-3 font-data-md text-data-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all"
            />
            <p
              id="step-preview"
              class="font-data-md text-[12px] leading-snug text-outline"
            ></p>
          </div>

          <!-- JSON Body -->
          <div class="flex flex-col gap-2 group h-32">
            <label
              for="body"
              class="font-data-md text-data-md text-on-surface-variant group-focus-within:text-primary-container transition-colors flex justify-between"
            >
              <span data-i18n="form.body">JSON Body</span>
              <span
                class="text-xs text-border-subtle font-normal"
                data-i18n="form.optional"
                >Opsiyonel</span
              >
            </label>
            <textarea
              id="body"
              placeholder='{"email":"test@test.com"}'
              class="w-full h-full resize-none bg-surface-container-lowest border border-border-subtle p-3 font-data-md text-data-md text-secondary focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all overflow-y-auto leading-relaxed"
            ></textarea>
          </div>

          <button
            type="submit"
            id="start-btn"
            class="w-full bg-primary-container text-[#000000] font-label-caps text-label-caps py-3 mt-2 hover:bg-primary transition-colors duration-200 flex items-center justify-center gap-2 disabled:opacity-60"
          >
            <span class="material-symbols-outlined text-[18px]">bolt</span>
            <span data-i18n="form.start">TESTİ BAŞLAT</span>
          </button>
          <button
            type="button"
            id="stop-btn"
            hidden
            class="w-full border border-signal-error text-signal-error font-label-caps text-label-caps py-3 mt-2 hover:bg-signal-error/10 transition-colors duration-200 flex items-center justify-center gap-2 disabled:opacity-60"
          >
            <span class="material-symbols-outlined text-[18px]"
              >stop_circle</span
            >
            <span data-i18n="form.stop">TESTİ DURDUR</span>
          </button>

          <p
            id="status-text"
            class="font-data-md text-data-md text-on-surface-variant"
          ></p>
        </form>
      </section>

      <!-- Sağ sütun -->
      <section class="lg:col-span-9 flex flex-col gap-4">
        <!-- Grafik kartı -->
        <div
          class="border border-border-subtle bg-surface-container-lowest p-5 flex flex-col"
        >
          <!-- Başlık satırı -->
          <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
            <div class="flex flex-wrap items-center gap-3">
              <h2
                class="font-headline-md text-headline-md text-on-surface flex items-center gap-2"
              >
                <span data-i18n="chart.title">Canlı Ölçüm</span>
                <span
                  id="live-badge"
                  hidden
                  class="inline-flex w-2 h-2 rounded-full bg-primary-container animate-pulse shadow-[0_0_8px_rgba(244,194,26,0.6)]"
                ></span>
              </h2>

              <!-- Nasıl okunur? -->
              <span class="group relative inline-flex">
                <span
                  class="material-symbols-outlined text-[18px] text-on-surface-variant hover:text-primary cursor-help"
                  >help</span
                >
                <div
                  class="pointer-events-none absolute top-full left-0 mt-2 w-[360px] bg-surface-container-lowest border border-border-subtle p-3 text-[12px] leading-relaxed text-on-surface opacity-0 group-hover:opacity-100 transition-opacity duration-150 z-30 shadow-lg flex flex-col gap-1.5"
                >
                  <p data-i18n="chart.help.healthy"></p>
                  <p data-i18n="chart.help.queue"></p>
                  <p data-i18n="chart.help.capacity"></p>
                  <p data-i18n="chart.help.errors"></p>
                  <p data-i18n="chart.help.warmup"></p>
                  <p class="text-outline" data-i18n="chart.help.controls"></p>
                </div>
              </span>

              <!-- Volta durum göstergeleri -->
              <span
                class="inline-flex items-center gap-1.5 border border-border-subtle px-2 py-1 font-data-md text-[12px] text-on-surface-variant whitespace-nowrap"
              >
                <span class="w-1.5 h-1.5 rounded-full bg-secondary"></span>
                <span id="lag-text">—</span>
              </span>
              <span
                class="inline-flex items-center border border-border-subtle px-2 py-1 font-data-md text-[12px] text-on-surface-variant whitespace-nowrap"
              >
                <span id="rate-text">—</span>
              </span>
            </div>

            <button
              type="button"
              id="zoom-reset"
              class="border border-secondary text-secondary font-label-caps text-label-caps px-4 py-2 hover:bg-secondary/10 transition-colors flex items-center gap-2"
            >
              <span class="material-symbols-outlined text-[16px]"
                >zoom_out_map</span
              >
              <span data-i18n="chart.reset">SIFIRLA</span>
            </button>
          </div>

          <!-- Volta zorlanıyor uyarısı -->
          <div
            id="overload-warning"
            hidden
            class="flex items-center gap-2 border border-primary-container/50 bg-primary-container/10 px-3 py-2 mb-3 text-primary-container font-data-md text-[13px]"
          >
            <span class="material-symbols-outlined text-[18px]">warning</span>
            <span data-i18n="chart.warning"
              >Volta zorlanıyor, sonuçlar güvenilir olmayabilir.</span
            >
          </div>

          <!-- Açıklama satırı (tıklanınca çizgi gizlenir/gösterilir) -->
          <div
            class="flex flex-wrap items-center gap-5 mb-3 font-data-md text-[12px] text-on-surface"
          >
            <button
              type="button"
              data-series="0"
              class="flex items-center gap-2 hover:text-primary transition-opacity"
            >
              <span class="w-4 h-0.5 bg-primary-container"></span
              ><span data-i18n="chart.series.avg">Ortalama</span>
            </button>
            <button
              type="button"
              data-series="1"
              class="flex items-center gap-2 hover:text-primary transition-opacity"
            >
              <span class="w-4 h-0.5 bg-secondary"></span
              ><span data-i18n="chart.series.p95">p95</span>
            </button>
            <button
              type="button"
              data-series="2"
              class="flex items-center gap-2 hover:text-primary transition-opacity"
            >
              <span class="w-4 h-0.5" style="background: #c4b5fd"></span
              ><span data-i18n="chart.series.p99">p99</span>
            </button>
            <button
              type="button"
              data-series="3"
              class="flex items-center gap-2 hover:text-primary transition-opacity"
            >
              <span class="w-4 h-0.5 bg-outline"></span
              ><span data-i18n="chart.series.completedRps">Başarılı RPS</span>
            </button>
            <button
              type="button"
              data-series="4"
              class="flex items-center gap-2 hover:text-primary transition-opacity"
            >
              <span class="w-4 border-t border-dashed border-on-surface"></span
              ><span data-i18n="chart.series.sentRps">Gönderilen RPS</span>
            </button>
          </div>

          <!-- Bilgi kutusu dışarı taşabilsin diye burada overflow-hidden yok -->
          <div class="h-[380px] tech-grid border border-border-subtle relative">
            <canvas id="chart"></canvas>
            <div
              id="chart-tooltip"
              hidden
              class="pointer-events-none absolute z-20 min-w-[210px] bg-surface-container-lowest/80 border border-border-subtle px-3 py-2 font-data-md text-[12px] flex flex-col gap-1 shadow-lg"
            ></div>
          </div>
        </div>

        <!-- Metrik kartları (data-hint: üzerine gelince bilgi kutusu) -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
          <div
            data-hint="avg"
            data-hint-color="#f4c21a"
            class="border border-border-subtle bg-surface-container-lowest p-4 relative group"
          >
            <div
              class="absolute top-0 left-0 w-1 h-full bg-border-subtle group-hover:bg-primary-container transition-colors"
            ></div>
            <div
              class="font-label-caps text-label-caps text-on-surface-variant mb-1"
            >
              <span data-hint-label data-i18n="metric.avg">ORTALAMA</span>
            </div>
            <div class="font-headline-lg text-headline-lg text-secondary">
              <span id="m-avg">—</span
              ><span
                class="text-data-lg font-data-lg ml-1 text-on-surface-variant"
                >ms</span
              >
            </div>
            <div class="font-data-md text-data-md text-primary/60">
              <span
                class="text-[10px] uppercase opacity-70"
                data-i18n="metric.live"
                >Anlık:</span
              >
              <span id="m-avg-live">—</span> ms
            </div>
          </div>
          <div
            data-hint="requests"
            data-hint-color="#64d8d7"
            class="border border-border-subtle bg-surface-container-lowest p-4 relative group"
          >
            <div
              class="absolute top-0 left-0 w-1 h-full bg-border-subtle group-hover:bg-secondary transition-colors"
            ></div>
            <div
              class="font-label-caps text-label-caps text-on-surface-variant mb-1"
            >
              <span data-hint-label data-i18n="metric.requests">İSTEK</span>
            </div>
            <div class="font-headline-lg text-headline-lg text-secondary">
              <span id="m-count">—</span
              ><span
                class="text-data-lg font-data-lg ml-1 text-on-surface-variant"
                data-i18n="unit.count"
                >adet</span
              >
            </div>
            <div class="font-data-md text-data-md text-primary/60">
              <span
                class="text-[10px] uppercase opacity-70"
                data-i18n="metric.live"
                >Anlık:</span
              >
              <span id="m-count-live">—</span> req/s
            </div>
          </div>
          <div
            data-hint="min"
            data-hint-color="#b5ebff"
            class="border border-border-subtle bg-surface-container-lowest p-4 relative group"
          >
            <div
              class="absolute top-0 left-0 w-1 h-full bg-border-subtle group-hover:bg-tertiary-fixed transition-colors"
            ></div>
            <div
              class="font-label-caps text-label-caps text-on-surface-variant mb-1"
            >
              <span data-hint-label data-i18n="metric.min">EN DÜŞÜK</span>
            </div>
            <div class="font-headline-lg text-headline-lg text-secondary">
              <span id="m-min">—</span
              ><span
                class="text-data-lg font-data-lg ml-1 text-on-surface-variant"
                >ms</span
              >
            </div>
            <div class="font-data-md text-data-md text-primary/60">
              <span
                class="text-[10px] uppercase opacity-70"
                data-i18n="metric.live"
                >Anlık:</span
              >
              <span id="m-min-live">—</span> ms
            </div>
          </div>
          <div
            data-hint="max"
            data-hint-color="#ff5555"
            data-hint-align="right"
            class="border border-border-subtle bg-surface-container-lowest p-4 relative group"
          >
            <div
              class="absolute top-0 left-0 w-1 h-full bg-border-subtle group-hover:bg-signal-error transition-colors"
            ></div>
            <div
              class="font-label-caps text-label-caps text-on-surface-variant mb-1"
            >
              <span data-hint-label data-i18n="metric.max">EN YÜKSEK</span>
            </div>
            <div class="font-headline-lg text-headline-lg text-secondary">
              <span id="m-max">—</span
              ><span
                class="text-data-lg font-data-lg ml-1 text-on-surface-variant"
                >ms</span
              >
            </div>
            <div class="font-data-md text-data-md text-primary/60">
              <span
                class="text-[10px] uppercase opacity-70"
                data-i18n="metric.live"
                >Anlık:</span
              >
              <span id="m-max-live">—</span> ms
            </div>
          </div>
        </div>

        <!-- Durum kodları ve istek günlüğü -->
        <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
          <!-- Bilgi kutuları kesilmesin diye bu kartta overflow-hidden yok -->
          <div
            class="border border-border-subtle bg-surface-container-lowest p-4 flex flex-col gap-3"
          >
            <div class="flex items-baseline justify-between">
              <h3
                class="font-label-caps text-label-caps text-on-surface-variant uppercase"
                data-i18n="statusCard.title"
              >
                Durum Kodu Dağılımı
              </h3>
              <span
                id="status-total"
                class="font-data-md text-[12px] text-outline"
              ></span>
            </div>
            <div
              id="status-bar"
              class="flex h-2 gap-px bg-surface-container overflow-hidden"
            ></div>
            <p
              id="status-empty"
              class="font-data-md text-data-md text-outline"
              data-i18n="statusCard.empty"
            >
              Henüz veri yok.
            </p>
            <div id="status-rows" class="flex flex-col gap-2.5"></div>
          </div>

          <div
            class="border border-border-subtle bg-surface-container-lowest flex flex-col"
          >
            <div
              class="bg-surface-container p-3 border-b border-border-subtle flex items-center justify-between"
            >
              <h3
                class="font-label-caps text-label-caps text-on-surface-variant uppercase"
                data-i18n="log.title"
              >
                İstek Günlüğü
              </h3>
              <span
                class="material-symbols-outlined text-on-surface-variant text-[18px]"
                >terminal</span
              >
            </div>
            <div
              id="terminal-log"
              class="p-4 font-data-md text-[12px] h-56 overflow-y-auto flex flex-col gap-1"
            ></div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/pages/dashboard.js"></script>
  </body>
</html>
