name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  install-and-start:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Start Volta and check that it responds
        run: |
          npm start > volta.log 2>&1 &
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 1 --retry-connrefused \
            http://localhost:4400/api/health

      - name: Show Volta's output
        if: always()
        run: cat volta.log || true
